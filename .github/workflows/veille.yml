name: Veille viager

# 2 passages par jour en heure de Bruxelles (13h et 19h).
# Le cron GitHub est en UTC et ne connait pas l'heure d'ete : on declenche donc
# aux deux heures UTC possibles et on laisse le job decider s'il doit tourner.
on:
  schedule:
    # Jamais a l'heure pile : c'est le creneau le plus encombre chez GitHub,
    # celui ou les taches planifiees sont le plus souvent retardees ou perdues.
    - cron: "5 11,12 * * *"  # 13h a Bruxelles (ete: 11h UTC / hiver: 12h UTC)
    - cron: "5 17,18 * * *"  # 19h
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test sans envoi ni ecriture"
        type: boolean
        default: false
      auto:
        description: "Declenchement automatique (respecte --min-interval)"
        type: boolean
        default: false

concurrency:
  group: viager-db          # jamais deux runs qui ecrivent seen.db en meme temps
  cancel-in-progress: false

permissions:
  contents: write           # pour committer seen.db

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # Fenetre de deux heures, pas une heure pile : GitHub livre regulierement
      # ses taches planifiees avec du retard. Le doublon eventuel est ecarte
      # plus loin par --min-interval, cote Python.
      - name: Sommes-nous dans un creneau de passage ?
        id: garde
        run: |
          H=$(TZ=Europe/Brussels date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          elif [ "$H" = "13" ] || [ "$H" = "14" ] || [ "$H" = "19" ] || [ "$H" = "20" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "Il est ${H}h a Bruxelles, hors creneau."
            echo "ok=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.garde.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        if: steps.garde.outputs.ok == 'true'
        run: pip install -r requirements.txt

      - name: Lancer la veille
        if: steps.garde.outputs.ok == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Un declenchement manuel force le passage ; un declenchement
          # automatique (cron GitHub ou tache planifiee du PC via auto=true)
          # respecte --min-interval pour qu'un seul passage ait lieu par creneau.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.auto }}" != "true" ]; then
            python main.py ${{ inputs.dry_run && '--dry-run' || '' }}
          else
            python main.py --min-interval 5
          fi

      - name: Sauvegarder la base
        if: steps.garde.outputs.ok == 'true' && !inputs.dry_run
        run: |
          git config user.name  "viager-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f seen.db agences_decouvertes.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien de neuf a sauvegarder."
          else
            git commit -m "veille: maj base $(TZ=Europe/Brussels date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "Nouvelle tentative de push ($i)..."
              sleep 5
            done
          fi
