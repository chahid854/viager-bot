name: Veille viager

# Objectif : ~2 passages par jour, autour de 13h et 19h heure de Bruxelles.
#
# L'ordonnanceur GitHub livre ses taches planifiees avec 0 a 4 heures de
# retard, parfois pas du tout. Plutot que d'exiger l'heure pile (ce qui
# revenait a refuser des livraisons parfaitement utilisables), on accepte
# toute livraison entre 11h et 22h et on laisse --min-interval garantir
# qu'un seul passage reel a lieu par demi-journee. Un declenchement en
# retard fait donc quand meme le travail — juste un peu plus tard.
#
# Les taches planifiees du PC (13h05/19h05, si le PC est allume) passent
# par workflow_dispatch avec auto=true et suivent la meme regle : premier
# arrive, seul servi.
on:
  schedule:
    # Deux heures UTC par cible pour couvrir l'heure d'ete/hiver ; jamais
    # l'heure pile, le creneau le plus encombre chez GitHub.
    - cron: "5 11,12 * * *"  # cible 13h a Bruxelles
    - cron: "5 17,18 * * *"  # cible 19h
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test sans envoi ni ecriture"
        type: boolean
        default: false
      auto:
        description: "Declenchement automatique (respecte --min-interval)"
        type: boolean
        default: false

concurrency:
  group: viager-db          # jamais deux runs qui ecrivent seen.db en meme temps
  cancel-in-progress: false

permissions:
  contents: write           # pour committer seen.db

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # Seule restriction restante : pas de notifications en pleine nuit si
      # une livraison arrive vraiment tres en retard. Le tri fin (un seul
      # passage par demi-journee) est fait par --min-interval, cote Python.
      - name: Heure decente ?
        id: garde
        run: |
          H=$(TZ=Europe/Brussels date +%-H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          elif [ "$H" -ge 11 ] && [ "$H" -le 22 ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "Il est ${H}h a Bruxelles : trop tard, on laisse dormir."
            echo "ok=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.garde.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        if: steps.garde.outputs.ok == 'true'
        run: pip install -r requirements.txt

      - name: Lancer la veille
        if: steps.garde.outputs.ok == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Un declenchement manuel force le passage ; tout declenchement
          # automatique (cron GitHub ou tache du PC via auto=true) respecte
          # --min-interval : le premier arrive fait le travail, les suivants
          # repartent en quelques secondes.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.auto }}" != "true" ]; then
            python main.py ${{ inputs.dry_run && '--dry-run' || '' }}
          else
            python main.py --min-interval 4
          fi

      - name: Sauvegarder la base
        if: steps.garde.outputs.ok == 'true' && !inputs.dry_run
        run: |
          git config user.name  "viager-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f seen.db agences_decouvertes.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien de neuf a sauvegarder."
          else
            git commit -m "veille: maj base $(TZ=Europe/Brussels date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "Nouvelle tentative de push ($i)..."
              sleep 5
            done
          fi
