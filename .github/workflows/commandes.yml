name: Commandes Telegram

# Sans ce workflow, une commande envoyee a 9h ne serait lue qu'a 13h.
# Ici on releve les messages une fois par heure : un run dure ~20 secondes et
# ne scrape rien. Compte donc jusqu'a une heure entre ta commande et sa
# reponse, ou force le relevé depuis l'onglet Actions.
on:
  schedule:
    # Une seule fois par heure. GitHub documente que plus l'intervalle d'une
    # tache planifiee est court, plus elle risque d'etre purement abandonnee ;
    # toutes les 30 minutes, la quasi-totalite des creneaux etait sautee.
    # La minute 23 evite les debuts d'heure, les plus encombres.
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: viager-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  commandes:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lire et executer les commandes
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --commands-only
      - name: Sauvegarder la base
        run: |
          git config user.name  "viager-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f seen.db 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Aucune commande recue."
          else
            git commit -m "commandes: maj filtres/offset"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 5
            done
          fi
